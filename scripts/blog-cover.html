<!doctype html>
<!-- Featured image template for journal articles (1200x630, the size LinkedIn and
     Facebook use for link previews). Render with headless Chrome, for example:
     chrome --headless --screenshot=out.png --window-size=1200,630
       "file:///.../scripts/blog-cover.html?a=corporate"                         -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0b0b09; --gold: #d3ab69; --gold-deep: #a9813f; --cream: #f3ede2; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  body { font-family: "Manrope", sans-serif; color: var(--cream); position: relative; }
  .pattern { position: absolute; inset: 0 0 0 auto; width: 560px; opacity: 0.16; }
  .glow { position: absolute; right: -160px; top: -160px; width: 720px; height: 720px; border-radius: 50%;
          background: radial-gradient(circle, rgba(211,171,105,0.28), rgba(211,171,105,0) 65%); }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(211,171,105,0.35); }
  .text { position: absolute; left: 76px; top: 76px; width: 660px; }
  .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
  h1 { margin-top: 26px; font-size: 58px; line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: var(--gold); }
  .rule { width: 84px; height: 4px; background: var(--gold); margin-top: 34px; }
  .sub { margin-top: 22px; font-size: 21px; line-height: 1.45; font-weight: 500; color: rgba(243,237,226,0.78); }
  .foot { position: absolute; left: 76px; bottom: 64px; display: flex; align-items: center; gap: 22px; }
  .foot img { height: 30px; }
  .foot span { font-size: 15px; font-weight: 700; letter-spacing: 0.14em; color: rgba(243,237,226,0.7); }
  .art { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); width: 360px; height: 360px; }
  .art * { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .art .soft { stroke: rgba(211,171,105,0.45); stroke-width: 2; }
  .art .fill { fill: var(--gold); stroke: none; }
  [data-cover] { display: none; }
</style>
</head>
<body>
  <svg class="pattern" viewBox="0 0 560 630" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <pattern id="dia" width="56" height="56" patternUnits="userSpaceOnUse">
        <path d="M28 4 52 28 28 52 4 28Z M28 16 40 28 28 40 16 28Z" fill="none" stroke="#d3ab69" stroke-width="1.4"/>
      </pattern>
    </defs>
    <rect width="560" height="630" fill="url(#dia)"/>
  </svg>
  <div class="glow"></div>
  <div class="frame"></div>

  <!-- Article: The Corporate Kaftan Is the New Power Suit -->
  <div data-cover="corporate">
    <div class="text">
      <p class="eyebrow">Oban Wears Journal &middot; Style Guides</p>
      <h1>The Corporate Kaftan Is the New <em>Power Suit</em></h1>
      <div class="rule"></div>
      <p class="sub">How Nigerian men are dressing to win in 2026</p>
    </div>
    <svg class="art" viewBox="0 0 360 360" aria-hidden="true">
      <circle class="soft" cx="180" cy="180" r="168"/>
      <circle class="soft" cx="180" cy="180" r="140"/>
      <path d="M96 262V214M146 262V182M196 262V146M246 262V108"/>
      <rect x="84" y="214" width="24" height="48" rx="3"/>
      <rect x="134" y="182" width="24" height="80" rx="3"/>
      <rect x="184" y="146" width="24" height="116" rx="3"/>
      <rect class="fill" x="234" y="108" width="24" height="154" rx="3"/>
      <path d="M70 262H290"/>
      <path d="M86 186 146 150 196 116 262 74"/>
      <path d="M236 72H264V100"/>
    </svg>
  </div>

  <!-- Article: Bespoke Kaftan in Lagos -->
  <div data-cover="bespoke">
    <div class="text">
      <p class="eyebrow">Oban Wears Journal &middot; Fabrics &amp; Craft</p>
      <h1>Bespoke Kaftan in Lagos: A Fit That Says <em>Power</em></h1>
      <div class="rule"></div>
      <p class="sub">The no-nonsense guide every Nigerian man needs</p>
    </div>
    <svg class="art" viewBox="0 0 360 360" aria-hidden="true">
      <circle class="soft" cx="180" cy="180" r="168"/>
      <circle cx="150" cy="200" r="78"/>
      <circle class="soft" cx="150" cy="200" r="58"/>
      <circle class="fill" cx="150" cy="200" r="10"/>
      <path d="M228 200H318V236H228"/>
      <path d="M244 200v12M260 200v18M276 200v12M292 200v18M308 200v12"/>
      <path d="M86 52 266 172"/>
      <ellipse cx="80" cy="48" rx="12" ry="5" transform="rotate(34 80 48)"/>
      <path class="soft" d="M70 42c-30-20-40 30-10 44s36 60 4 86"/>
    </svg>
  </div>

  <div class="foot">
    <img src="../assets/oban-wordmark-gold.png" alt="">
    <span>OBANWEARS.COM</span>
  </div>

  <script>
    const key = new URLSearchParams(location.search).get("a") || "corporate";
    const el = document.querySelector(`[data-cover="${key}"]`);
    if (el) el.style.display = "block";
  </script>
</body>
</html>
