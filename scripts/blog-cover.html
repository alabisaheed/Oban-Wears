<!doctype html>
<!-- Crops a product photo to a 1200x630 featured image for a journal article (the
     size LinkedIn and Facebook use for link previews). Render with headless Chrome:
     chrome --headless=new --window-size=1200,630 --screenshot=assets/blog/<slug>.jpg
       "file:///.../scripts/blog-cover.html?src=<photo path>&fit=cover&pos=center%2045%25&bg=%23000"
     src  photo path relative to the repo root
     fit  cover (fill the frame) or contain (whole photo on the background colour)
     pos  CSS object-position, default center
     bg   background colour behind a contained photo                                -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  img { display: block; width: 1200px; height: 630px; }
</style>
</head>
<body>
  <img id="photo" alt="">
  <script>
    const q = new URLSearchParams(location.search);
    const img = document.getElementById("photo");
    document.body.style.background = q.get("bg") || "#000";
    img.style.objectFit = q.get("fit") || "cover";
    img.style.objectPosition = q.get("pos") || "center";
    img.src = "../" + (q.get("src") || "");
  </script>
</body>
</html>
