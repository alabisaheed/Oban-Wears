  <meta charset="UTF-8">
  <title>Oban Product Preview Tool</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 20px;
    }
    h1 {
      text-align: center;
      color: #d3ab69;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .image-container {
      width: 100%;
      height: 350px;
      background: #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .meta {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .code {
      font-size: 0.9rem;
      color: #d3ab69;
      font-weight: bold;
    }
    .name {
      font-size: 1.1rem;
      font-weight: bold;
    }
    .color-swatch-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .swatch {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      border: 1px solid #fff;
    }
    .color-hex {
      font-family: monospace;
      font-size: 0.95rem;
    }
    .desc {
      font-size: 0.9rem;
      color: #b0b0b0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Oban Product Preview Tool</h1>
  <p style="text-align:center;">This page loads the product list from <code>script.js?v=20260827_v3</code> and displays all 68 products side by side with their image, swatch color, and description.</p>
  
  <div id="previewGrid" class="grid"></div>

  <!-- We will load script.js?v=20260827_v3. But script.js?v=20260827_v3 runs code immediately on DOMContentLoaded or directly.
       To prevent errors, we can mock the DOM elements script.js?v=20260827_v3 expects or redefine its render functions.
  -->
  <div id="productGrid" style="display:none;"></div>
  <div id="emptyState" style="display:none;"></div>
  <div id="searchPanel" style="display:none;"></div>
  <input id="siteSearch" type="hidden">
  <div id="searchToggle" style="display:none;"></div>
  <div id="closeSearch" style="display:none;"></div>
  <div id="mobileNav" style="display:none;"></div>
  <div id="menuButton" style="display:none;"></div>
  <div id="cartDrawer" style="display:none;"></div>
  <div id="overlay" style="display:none;"></div>
  <div id="cartButton" style="display:none;"></div>
  <div id="closeCart" style="display:none;"></div>
  <div id="startShopping" style="display:none;"></div>
  <div id="cartCount" style="display:none;"></div>
  <div id="cartItems" style="display:none;"></div>
  <div id="cartEmpty" style="display:none;"></div>
  <div id="cartSummary" style="display:none;"></div>
  <div id="cartTotal" style="display:none;"></div>
  <div id="productDialog" style="display:none;"></div>
  <div id="dialogContent" style="display:none;"></div>
  <div id="closeDialog" style="display:none;"></div>
  <div id="toast" style="display:none;"></div>
  <div id="checkoutButton" style="display:none;"></div>
  <div id="newsletterForm" style="display:none;"></div>
  <div id="formMessage" style="display:none;"></div>
  <div id="sortProducts" style="display:none;"></div>

  <script>
    // Mock the DOM APIs used in script.js?v=20260827_v3 to avoid errors during loading
    document.querySelectorAll = function(sel) {
      if (sel === "button.filter[data-filter]" || sel === "[data-category-jump]" || sel === "button.filter" || sel === ".filter") {
        return [];
      }
      if (sel === ".campaign-slide" || sel === "[data-hero-slide]") {
        return [];
      }
      return HTMLDocument.prototype.querySelectorAll.apply(this, arguments);
    };
  </script>
  <script src="script.js?v=20260827_v3"></script>
  <script>
    // Once script.js?v=20260827_v3 is loaded, products array is populated. We can render it in our own grid.
    console.log("Loaded products:", products);
    const container = document.getElementById("previewGrid");
    products.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      
      const imgCont = document.createElement("div");
      imgCont.className = "image-container";
      if (p.images && p.images.length > 0) {
        const img = document.createElement("img");
        img.src = p.images[0];
        img.alt = p.name;
        imgCont.appendChild(img);
      } else {
        imgCont.innerHTML = "No Image Available";
      }
      card.appendChild(imgCont);

      const meta = document.createElement("div");
      meta.className = "meta";

      const code = document.createElement("div");
      code.className = "code";
      code.textContent = p.code;
      meta.appendChild(code);

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.name;
      meta.appendChild(name);

      const swatchRow = document.createElement("div");
      swatchRow.className = "color-swatch-row";
      const swatch = document.createElement("div");
      swatch.className = "swatch";
      swatch.style.backgroundColor = p.color;
      const hex = document.createElement("span");
      hex.className = "color-hex";
      hex.textContent = p.color;
      swatchRow.appendChild(swatch);
      swatchRow.appendChild(hex);
      meta.appendChild(swatchRow);

      const desc = document.createElement("div");
      desc.className = "desc";
      desc.innerHTML = `<strong>Description:</strong> ${p.description}`;
      meta.appendChild(desc);

      card.appendChild(meta);
      container.appendChild(card);
    });
  </script>
</body>
</html>
